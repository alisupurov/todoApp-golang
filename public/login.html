<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TodoApp — Вход</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }

    h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 28px; }

    .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: #f3f4f6; border-radius: 8px; padding: 4px; }
    .tab {
      flex: 1; padding: 8px; border: none; background: transparent;
      border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; color: #6b7280;
      transition: all .15s;
    }
    .tab.active { background: #fff; color: #1a1a2e; box-shadow: 0 1px 4px rgba(0,0,0,0.10); }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 14px; border: 1.5px solid #e5e7eb;
      border-radius: 8px; font-size: 14px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #6366f1; }

    .btn {
      width: 100%; padding: 11px; background: #6366f1; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: background .15s;
    }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    .error {
      background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
      padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>TodoApp</h1>
    <p class="subtitle">Управляй задачами эффективно</p>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Вход</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Регистрация</button>
    </div>

    <div id="error" class="error"></div>

    <div id="form-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="ivan@example.com" />
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" placeholder="••••••" />
      </div>
      <button class="btn" id="btn-login" onclick="login()">Войти</button>
    </div>

    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="ivan@example.com" />
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="reg-password" placeholder="Минимум 6 символов" />
      </div>
      <button class="btn" id="btn-register" onclick="register()">Зарегистрироваться</button>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin + '/api/v1';

    function switchTab(tab) {
      document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      hideError();
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('error').classList.remove('visible');
    }

    async function login() {
      hideError();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) { showError('Заполните все поля'); return; }

      const btn = document.getElementById('btn-login');
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(res.status === 401 ? 'Неверный email или пароль' : (data.error || 'Ошибка входа'));
          return;
        }

        localStorage.setItem('token', data.token);
        window.location.href = '/app';
      } catch {
        showError('Нет соединения с сервером');
      } finally {
        btn.disabled = false;
      }
    }

    async function register() {
      hideError();
      const email    = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      if (!email || !password) { showError('Заполните все поля'); return; }
      if (password.length < 6) { showError('Пароль минимум 6 символов'); return; }

      const btn = document.getElementById('btn-register');
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(res.status === 409 ? 'Email уже занят' : (data.error || 'Ошибка регистрации'));
          return;
        }

        localStorage.setItem('token', data.token);
        window.location.href = '/app';
      } catch {
        showError('Нет соединения с сервером');
      } finally {
        btn.disabled = false;
      }
    }

    // Если уже залогинен — перекинуть в приложение
    if (localStorage.getItem('token')) {
      window.location.href = '/app';
    }
  </script>
</body>
</html>
