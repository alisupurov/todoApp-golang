      summary: Удалить задачу
      tags:
      - tasks
    get:
      description: Получить задачу по идентификатору
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Задача
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_alisupurov_todoApp-golang_internal_core_transport_http_response.ErrorResponse'
        "404":
