        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_alisupurov_todoApp-golang_internal_core_transport_http_response.ErrorResponse'
      summary: Создать задачу
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Удалить задачу по идентификатору
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
