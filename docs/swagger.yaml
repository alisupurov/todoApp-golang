      - tasks
    patch:
      consumes:
      - application/json
      description: Частично обновить данные задачи
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      - description: PatchTask тело
        in: body
        name: request
        required: true
