paths:
  /statistics:
    get:
      description: Получить агрегированную статистику по задачам с фильтрами по автору
        и периоду
      parameters:
      - description: ID автора задачи
        in: query
        name: user_id
        type: integer
      - description: Дата начала периода (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Дата конца периода (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Статистика
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_alisupurov_todoApp-golang_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_alisupurov_todoApp-golang_internal_core_transport_http_response.ErrorResponse'
      summary: Получить статистику по задачам
      tags:
      - statistics
  /tasks:
    get:
      description: Получить список задач с пагинацией и фильтром по автору
      parameters:
      - description: Лимит записей
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      - description: ID автора задачи
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список задач
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
